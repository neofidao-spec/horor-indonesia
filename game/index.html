<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malam Jumat Kliwon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;background:#0a0a0a;image-rendering:pixelated}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#dialog-box{position:absolute;bottom:10%;left:5%;right:5%;background:rgba(0,0,0,0.85);border:2px solid #3a1a1a;border-radius:8px;padding:16px;color:#ccc;font-family:'Courier New',monospace;font-size:14px;line-height:1.6;display:none;pointer-events:auto}
#dialog-speaker{color:#8b3a3a;font-weight:bold;margin-bottom:4px}
#dialog-text{color:#ddd;min-height:20px}
#dialog-continue{color:#666;text-align:right;margin-top:8px;font-size:12px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#inventory-bar{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);display:none;gap:8px;pointer-events:auto}
.inv-item{width:48px;height:48px;background:rgba(0,0,0,0.7);border:2px solid #3a1a1a;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:10px;text-align:center;padding:2px;word-break:break-word;pointer-events:auto;cursor:pointer}
#loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;font-family:'Courier New',monospace;color:#8b3a3a}
#loading-screen h1{font-size:24px;margin-bottom:8px;letter-spacing:4px}
#loading-screen p{font-size:14px;color:#666;animation:blink 1.5s infinite}
#title-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;font-family:'Courier New',monospace}
#title-screen h1{color:#8b3a3a;font-size:28px;letter-spacing:6px;text-shadow:0 0 20px rgba(139,58,58,0.5);margin-bottom:4px}
#title-screen .sub{color:#5a2a2a;font-size:14px;margin-bottom:30px}
#title-screen .tagline{color:#444;font-size:11px;margin-bottom:40px;max-width:280px;text-align:center;line-height:1.6}
.menu-btn{background:transparent;border:2px solid #3a1a1a;color:#8b3a3a;padding:12px 40px;font-size:16px;font-family:'Courier New',monospace;margin:6px;cursor:pointer;pointer-events:auto;transition:all 0.3s;letter-spacing:2px}
.menu-btn:hover,.menu-btn:active{background:#3a1a1a;color:#ccc}
#gameover-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;font-family:'Courier New',monospace}
#gameover-screen h1{color:#8b3a3a;font-size:32px;letter-spacing:8px;margin-bottom:10px}
#gameover-screen p{color:#666;font-size:14px;margin-bottom:30px}
#pause-btn{position:fixed;top:12px;right:12px;width:40px;height:40px;background:rgba(0,0,0,0.5);border:1px solid #3a1a1a;border-radius:6px;color:#8b3a3a;font-size:20px;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:auto;cursor:pointer;font-family:'Courier New',monospace}
#pause-menu{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;font-family:'Courier New',monospace}
#pause-menu h2{color:#8b3a3a;font-size:24px;margin-bottom:20px}
#flash-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:none;z-index:30;pointer-events:none}
#subtitle-overlay{position:absolute;top:12%;left:10%;right:10%;text-align:center;color:#666;font-family:'Courier New',monospace;font-size:14px;display:none;pointer-events:none;z-index:15;background:rgba(0,0,0,0.5);padding:8px;border-radius:4px}
.touch-controls{position:fixed;bottom:20px;left:20px;right:20px;display:none;justify-content:space-between;z-index:12;pointer-events:none}
.touch-btn{width:64px;height:64px;background:rgba(0,0,0,0.3);border:2px solid rgba(139,58,58,0.4);border-radius:50%;color:#8b3a3a;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
.touch-btn:active{background:rgba(139,58,58,0.3)}
.touch-dpad{position:fixed;bottom:30px;left:30px;display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px 64px;gap:2px;z-index:12}
.touch-dpad .touch-btn{width:60px;height:60px}
.touch-dpad .empty{width:60px;height:60px}
.action-btn{position:fixed;bottom:40px;right:40px;width:72px;height:72px;background:rgba(139,58,58,0.3);border:2px solid #8b3a3a;border-radius:50%;color:#fff;font-size:14px;display:none;align-items:center;justify-content:center;z-index:12;pointer-events:auto;touch-action:none;font-family:'Courier New',monospace}
.action-btn:active{background:rgba(139,58,58,0.6)}
@media(max-width:480px){
  .touch-btn{width:52px;height:52px;font-size:18px}
  .touch-dpad{grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px 54px;left:10px;bottom:20px}
  .touch-dpad .touch-btn,.touch-dpad .empty{width:50px;height:50px}
  .action-btn{width:62px;height:62px;font-size:12px;right:20px;bottom:30px}
  #dialog-box{font-size:13px;bottom:8%;left:3%;right:3%}
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div id="subtitle-overlay"></div>
  <div id="dialog-box">
    <div id="dialog-speaker"></div>
    <div id="dialog-text"></div>
    <div id="dialog-continue">[ sentuh untuk lanjut ]</div>
  </div>
  <div id="inventory-bar"></div>
</div>

<button id="pause-btn">II</button>

<div id="pause-menu">
  <h2>— JEDA —</h2>
  <button class="menu-btn" onclick="resumeGame()">LANJUT</button>
  <button class="menu-btn" onclick="saveGame()">SIMPAN</button>
  <button class="menu-btn" onclick="loadGame()">MUAT</button>
  <button class="menu-btn" onclick="goToTitle()">MENU UTAMA</button>
</div>

<div id="loading-screen">
  <h1>MALAM JUMAT KLIWON</h1>
  <p>memuat...</p>
</div>

<div id="title-screen">
  <h1>MALAM JUMAT KLIWON</h1>
  <div class="sub">sebuah horor interaktif</div>
  <div class="tagline">"Mbah pergi. Desa sepi. Dan sesuatu menunggu di kegelapan."</div>
  <button class="menu-btn" onclick="startNewGame()">MULAI</button>
  <button class="menu-btn" onclick="showLoadMenu()">LANJUTKAN</button>
  <button class="menu-btn" onclick="showAbout()">TENTANG</button>
</div>

<div id="gameover-screen">
  <h1>MATI</h1>
  <p id="gameover-reason">Kamu telah meninggal...</p>
  <button class="menu-btn" onclick="retryFromCheckpoint()">COBA LAGI</button>
  <button class="menu-btn" onclick="goToTitle()">MENU UTAMA</button>
</div>

<div id="flash-overlay"></div>

<div class="touch-dpad" id="touch-dpad">
  <div class="empty"></div>
  <button class="touch-btn" data-dir="up">▲</button>
  <div class="empty"></div>
  <button class="touch-btn" data-dir="left">◀</button>
  <button class="touch-btn" data-dir="down">▼</button>
  <button class="touch-btn" data-dir="right">▶</button>
</div>
<button class="action-btn" id="action-btn">AKSI</button>

<script src="engine.js"></script>
<script src="assets.js"></script>
<script src="scenes/scene-loader.js"></script>
<script src="scenes/rumah-tua.js"></script>
<script src="scenes/makam.js"></script>
<script src="scenes/sawah.js"></script>
<script src="main.js"></script>
</body>
</html>
